stages:
  - build
  - test
  - release
  - deploy

variables:
  APPLICATION_NAME: whereabouts-display-board

  CONTAINER_IMAGE: ${AWS_ECR_PUBLIC_URL}/${APPLICATION_NAME}
  CONTAINER_IMAGE_TEST: ${CONTAINER_IMAGE}:test
  CONTAINER_IMAGE_LATEST: ${CONTAINER_IMAGE}:latest
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}

  K8S_NODEPORT_PORT: 30777

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    # Create repository in ECR if it does not exist yet
    - >
      aws ecr-public create-repository --region us-east-1 --repository-name ${APPLICATION_NAME}
      || echo "Repository might have already existed"
  script:
    - docker build --build-arg APP_VERSION=${CI_COMMIT_TAG} -t ${CONTAINER_IMAGE_TEST} .
    - docker push ${CONTAINER_IMAGE_TEST}

test:
  stage: test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - >
      docker run --rm
      --env IDENTIFICATION_URL=http://employee-manager/v3/users/self
      ${CONTAINER_IMAGE_TEST}
      npm run coverage

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker pull ${CONTAINER_IMAGE_TEST}
    - docker tag ${CONTAINER_IMAGE_TEST} ${CONTAINER_IMAGE_LATEST}
    - docker tag ${CONTAINER_IMAGE_TEST} ${CONTAINER_IMAGE_TAGGED}
    - docker push ${CONTAINER_IMAGE_LATEST}
    - docker push ${CONTAINER_IMAGE_TAGGED}

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - kubectl config use-context eks/gitlab-agent-for-kubernetes:eks
    - kubectl config set-context --current --namespace=${KUBERNETES_NAMESPACE}
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -
    - kubectl rollout status deployment/${APPLICATION_NAME} --timeout=120s
